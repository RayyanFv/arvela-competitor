pipeline_id: "gtm_only"
display_name: "GTM Only"
company_id: "arvela"
enabled: true

objective:
  text: "[REQUIRED]"
  focus_area: "gtm"
  horizon: "sprint"

sequence:
  - step: 1
    agent_id: "cmo"
    task: "Build weekly GTM execution plan and sales playbook updates based on objective."
    skip_if: null
    timeout_minutes: 8

on_dod_failure:
  action: "halt"
  max_retries: 1
  retry_prompt_suffix: "Your output missed: {failed_checks}"
  notify_agent: "ceo"

pipeline_budget:
  max_total_usd: 2.0
  on_exceeded: "halt"

output:
  save_individual: true
  save_combined_report: true
  combined_report_format: "markdown"
  output_dir: "storage/outputs"
  timestamp_files: true
